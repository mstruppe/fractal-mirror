<!doctype html>
<!--
  FRACTAL · The Shell — second build slice of the Workspace Foundation (the hangar's first artifact).
  Working tool, not canon (C-092 class). Document of record: Fractal_Workspace_Foundation §6–§7 (v0.3, 2026-08-25).
  Static and dependency-free by decision: no toolchain, no server requirement, no framework.
  Read-only by law: the store is never written from a pane.
  Slice 3 — the cockpit (the commission's first build, v0.5 2026-08-26): the right-hand pane is
  summonable-pane #1 (the pattern the later editor pane repeats); it speaks the vendor-neutral
  /engine/* seam to the local engine room when this page is served by it — otherwise the seat is
  a door, never an engine. The pane itself still writes nothing; the engine's agent acts only
  through the in-pane C-008 permission moment. Rituals stay words: /fractal and /close are typed.
  The rider grammar (Max's sketch, 2026-08-27): the workspace BORDERS themselves are the dock —
  all four edges are magnetic, for the rider and for the window's edges; there is no bar object.
  The cockpit's home is a RIDER resting on whichever border it was left on; one drag slides it
  along an edge, carries it to another, or (pulled past the magnetic reach) detaches it.
  Three states, fluid: rider (folded) · window (one object — "mini" when one border is held
  magnetically on a workspace border, floating when free; one default size) · pane (in the
  layout flow). Position is law: where the cockpit sits decides which side it unfolds to —
  read from the seat at the moment of unfolding. Three borders in reach unfold the window
  into the pane by themselves (it spans a full axis — a pane in all but name). The magnet's
  reach is SNAP=37px (+15%) and grows with drag speed — a fling docks from further out;
  detach thresholds stay static. The composer's top edge is a drag seam: 12 rows max, never
  closer than 3 text lines to the cockpit's own top border — the lower cap governs.
  Buttons are the fixed layer (deterministic sizes/paths), drags the free layer.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FRACTAL · The Shell</title>
<link rel="stylesheet" href="shell.css">
</head>
<body>
<header id="topbar">
  <div id="brand"><span class="mark">FRACTAL</span> · the Shell <em>· hangar prototype</em></div>
  <div id="status" role="status">—</div>
  <button id="layout-btn" title="Layout — where the windows sit" aria-haspopup="menu" aria-expanded="false">◨</button>
  <button id="reader-btn" title="Reader — open / close" aria-label="Toggle the reader window">▤</button>
  <button id="theme" title="Appearance: auto" aria-label="Toggle light/dark mode">◐</button>
</header>
<div id="layout-menu" hidden role="menu" aria-label="Default layouts">
  <button data-layout="cl" role="menuitem">◧&ensp;Cockpit left · screen right</button>
  <button data-layout="cr" role="menuitem">◨&ensp;Screen left · cockpit right</button>
</div>

<aside id="nav">
  <!-- the published estate is the GROUND STATE, not a mode — it needs no button (Max's call,
       2026-08-27). One control: the instance grant; a granted read that misses falls back to
       the published estate by itself. Later this button births and enters projects. -->
  <div id="tiers">
    <button id="tier-local" class="tier" title="Grant this page read access to your instance folder (Chromium browsers)">My instance…</button>
  </div>
  <div id="quest"></div>
  <div id="explorer-wrap" hidden>
    <h3>The estate <span id="root-name"></span></h3>
    <div id="explorer"></div>
  </div>
  <footer id="nav-foot">read-only · the store is never written from a pane</footer>
</aside>

<div id="nav-resize" title="Drag to resize · double-click to reset"></div>
<main id="content"></main>

<!-- the rider — the cockpit folded, resting on a workspace border (the borders are the dock).
     Click it to unfold the pane; ❐ opens the default-size mini window; one drag slides it
     along its edge, carries it to another, or pulls it free into the floating window. -->
<!-- the rider is a BUBBLE (Max's sketch, 2026-08-27): the ⎈ mark resting on the border;
     hovering it blooms the menu — the two doors emerge as satellite bubbles fanned into
     the workspace. A circle has no orientation: every edge gets the same bubble. -->
<div id="rider" data-edge="bottom" role="button" tabindex="0"
     title="Cockpit — click to unfold · drag to slide or detach">
  <canvas id="rider-orb" aria-hidden="true"></canvas>
  <span class="r-mark">⎈</span>
  <button id="rider-pane" class="sat" type="button" title="Unfold to pane">◨</button>
  <button id="rider-mini" class="sat" type="button" title="Open as mini window (default size)">❐</button>
</div>
<!-- the window's shadow — the deferred morph's preview (Max's step, 2026-08-27):
     while the rider is dragged beyond every border's reach, this ghost shows what
     releasing would make; back in reach it vanishes and the rider simply redocks. -->
<div id="win-shadow" hidden></div>

<!-- the structure (station skin; Max's layout sketch): grey beams hold the
     workspace — a real frame, joints overshooting like scaffolding — and the
     MAGNETIC DOCK LINE runs just inside them: the very line the snap law uses,
     made visible, with a light looping it. The topbar and rail attach outside. -->
<div id="frame" aria-hidden="true">
  <i class="beam h top"></i><i class="beam h bot"></i>
  <i class="beam v left"></i><i class="beam v right"></i>
  <svg id="dockline">
    <rect class="base"/>
    <rect class="comet"/>
  </svg>
</div>

<div id="cockpit-resize" title="Drag to resize · double-click to reset"></div>
<aside id="cockpit" hidden>
  <div class="win-h n"></div><div class="win-h s"></div><div class="win-h e"></div><div class="win-h w"></div>
  <div class="win-h ne"></div><div class="win-h nw"></div><div class="win-h se"></div><div class="win-h sw"></div>
  <div id="cockpit-head">
    <span class="label">Cockpit</span>
    <span id="cockpit-state">—</span>
    <span id="cockpit-btns">
      <button id="cp-to-pane" class="cp-btn win-only" type="button" title="Unfold to pane">◨</button>
      <button id="cp-home" class="cp-btn win-only" type="button" title="Home — fold to the dock">⌂</button>
      <button id="cp-to-window" class="cp-btn pane-only" type="button" title="To window (default size, at home)">❐</button>
      <button id="cp-fold" class="cp-btn pane-only" type="button" title="Fold to the dock">–</button>
    </span>
  </div>
  <div id="cockpit-log"></div>
  <form id="cockpit-form">
    <div id="input-seam" title="Drag to grow the input · double-click to reset"></div>
    <textarea id="cockpit-input" rows="2" placeholder="Speak to the agent — Enter sends, Shift+Enter for a new line"></textarea>
    <div id="cockpit-controls">
      <button id="cockpit-stop" type="button" hidden>■ stop</button>
      <button id="cockpit-send" type="submit" title="Send">↑</button>
    </div>
  </form>
</aside>

<script src="shell.js"></script>
</body>
</html>
